# À copier dans /etc/nginx/sites-available/ puis lier dans sites-enabled/ :
#   sudo cp api.les-portes.fwszs.dev.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.les-portes.fwszs.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Puis lancer Certbot, qui éditera ce fichier pour ajouter le bloc HTTPS/443 :
#   sudo certbot --nginx -d api.les-portes.fwszs.dev

server {
  listen 80;
  server_name api.les-portes.fwszs.dev;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
