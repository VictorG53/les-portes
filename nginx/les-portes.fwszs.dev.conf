# Nginx de l'hôte (hors Docker) : reverse proxy vers le conteneur du frontend (voir docker run dans le
# workflow de déploiement, port hôte 8005).
# À copier dans /etc/nginx/sites-available/ puis lier dans sites-enabled/ :
#   sudo cp les-portes.fwszs.dev.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/les-portes.fwszs.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Puis lancer Certbot, qui éditera ce fichier pour ajouter le bloc HTTPS/443 :
#   sudo certbot --nginx -d les-portes.fwszs.dev

server {
  listen 80;
  server_name les-portes.fwszs.dev;

  location / {
    proxy_pass http://127.0.0.1:8005;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
